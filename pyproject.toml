[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isw-fits-tools"
version = "0.2.0"
description = "Comprehensive FITS file manipulation and image processing toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    {name = "Peter Doherty", email = "peter.doherty@cfa.harvard.edu"}
]

keywords = ["fits", "astronomy", "image-processing", "ccd", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.23",
    "astropy>=5.0",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/peterdoherty/fits-tools"
Documentation = "https://github.com/peterdoherty/fits-tools/tree/main/docs/manual"
Repository = "https://github.com/peterdoherty/fits-tools"
Issues = "https://github.com/peterdoherty/fits-tools/issues"

[project.optional-dependencies]
progress = ["tqdm"]
plotting = ["matplotlib>=3.7"]
alignment = ["scikit-image>=0.22"]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "scikit-image>=0.22",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fits_tools*"]

[tool.setuptools.package-data]
fits_tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=fits_tools",
    "--cov-report=term-missing",
]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/fits_tools/array_validation.py",
    "src/fits_tools/artifacts/report.py",
    "src/fits_tools/cli_utils.py",
    "src/fits_tools/constants.py",
    "src/fits_tools/exceptions.py",
    "src/fits_tools/fits_output.py",
    "src/fits_tools/hdu.py",
    "src/fits_tools/hdu_ops.py",
    "src/fits_tools/header_utils.py",
    "src/fits_tools/image_types.py",
    "src/fits_tools/image_processing/combining.py",
    "src/fits_tools/image_processing/result_types.py",
    "src/fits_tools/image_processing/streaming.py",
    "src/fits_tools/io.py",
    "src/fits_tools/keywords.py",
    "src/fits_tools/resolved_hdu.py",
    "src/fits_tools/sections.py",
    "src/fits_tools/selection.py",
    "src/fits_tools/simulation/core.py",
    "src/fits_tools/simulation/noise.py",
    "src/fits_tools/types.py",
    "src/fits_tools/utils.py",
    "src/fits_tools/validate.py",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fits_tools.*"
ignore_missing_imports = true
